name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make kiss_interface
        working-directory: kiss-interface

      - name: Run tests
        run: make test
        working-directory: kiss-interface
